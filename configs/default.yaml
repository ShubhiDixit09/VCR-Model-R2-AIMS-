model:
  id: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: float16

image:
  view: grounded
  min_pixels: 200704       # 256 * 28 * 28
  max_pixels: 602112       # 768 * 28 * 28

inference:
  choice_labels: [A, B, C, D]
  answer_temperature: 1.0
  rationale_temperature: 1.0
  joint_rule: product
  seed: 42

output:
  directory: outputs
